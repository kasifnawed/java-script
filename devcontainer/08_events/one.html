<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Events</title>
</head>
<body style="background-color: #212121; color: #FFFF;">
    <h2>Amazing Images</h2>
    <div>
       <ul id="Images">
        <li><img width="200px" id="photoshop" src="https://images.pexels.com/photos/39795856/pexels-photo-39795856.jpeg" alt="photoshop"></li>
        <li><img width="200px" id="japan" src="https://images.pexels.com/photos/39502224/pexels-photo-39502224.jpeg" alt=""></li>
        <li><img width="200px" id= "river" src="https://images.pexels.com/photos/14942582/pexels-photo-14942582.jpeg" alt=""></li>
        <li><img width="200px" id="animal" src="https://images.pexels.com/photos/39568354/pexels-photo-39568354.jpeg" alt=""></li>
        <li><a  style="color: aliceblue;" href="https://google.com" id="google">Google</a></li>
       </ul>
    </div>
</body>
<script>
    // document.getElementById('animal').onclick = function(){
    //     alert("animal clicked")
    // }// not best approch

    //   document.getElementById('').addEventListener('click', function(e){
    //     alert("animal clicked")

    document.querySelector('#Images').addEventListener
    ('click',function (e){
         console.log(e.target.tagName);

         if (e.target.tagName === 'IMG'){
                 console.log(e.target.id);
         }
         let removeIt = e.target.parentNode
         removeIt.remove()




        
        
    })

     // removeIt.parentNode.removeChild(removeIt) 
   
</script>
</html>
